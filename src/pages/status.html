<!doctype html>

<link rel="canonical" href="https://lcrp5m.net/status">
</head>
<body>
<!-- @nav -->

<main id="main">
  <header class="phead" data-mark="Online">
    <div class="wrap">
      <nav class="crumbs mono" aria-label="Breadcrumb"><a href="/">Home</a><span>/</span><span>Status</span></nav>
      <h1>System <span class="slash">status</span></h1>
      <p>Live checks on the city and everything around it. Refreshes every minute. Each bar is one check.</p>

  <div class="section section--tight" data-board>
    <div class="wrap">
      <div class="board__summary chamfer">
        <div class="board__state"><i class="dot" data-state-dot></i><h2 data-state>Checking systems</h2></div>
        <div class="board__meta mono"><span data-updated></span><a href="https://status.lcrp5m.net/status/lcrp" rel="noopener">Full history</a></div>
      </div>
      <div data-groups><div class="skel mono">Loading monitors...</div></div>
    </div>
  </div>
</main>
